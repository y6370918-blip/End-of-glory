name: Verify source and deployment

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-build.txt
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- data.js assets cover.1x.jpg cover.2x.jpg thumbnail.jpg
      - run: npm test
      - run: npm run test:campaign
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:connections
      - run: npm run audit:map:confirmed
      - run: npm run package:server
