<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>EOG地图数据编辑器</title>
	<link rel="stylesheet" href="/tools/map-editor/editor.css">
	<script src="/tools/map-editor/diff.js"></script>
	<script defer src="/tools/map-editor/editor.js"></script>
</head>
<body>
	<header>
		<strong>EOG地图数据编辑器</strong>
		<span>6082×6000印刷地图 · 分区确认后保存 · 不访问Historical初设</span>
		<button id="reload">重新载入</button>
		<button id="create-space">新建地块</button>
		<button id="audit">审计草稿</button>
		<button id="save" class="confirm">保存全部修改</button>
	</header>
	<aside>
		<nav><button data-mode="spaces" class="active">地块</button><button data-mode="edges">连接</button></nav>
		<label><span>审计区域</span><select id="region-filter"><option value="all">全图</option></select></label>
		<div class="view-controls">
			<label><span>缩放</span><input id="zoom" type="range" min="20" max="200" step="5" value="50"><output id="zoom-value">50%</output></label>
			<label><span>地图透明度</span><input id="map-opacity" type="range" min="10" max="100" step="5" value="100"></label>
			<button id="fit-region">适应当前区域</button>
		</div>
		<fieldset><legend>图层</legend>
			<label><input id="layer-map" type="checkbox" checked>印刷地图</label>
			<label><input id="layer-boxes" type="checkbox" checked>地块框</label>
			<label><input id="layer-names" type="checkbox" checked>地块名称</label>
			<label><input id="layer-current" type="checkbox" checked>正式连线</label>
			<label><input id="layer-proposed" type="checkbox" checked>拟议修改</label>
		</fieldset>
		<fieldset class="edge-legend"><legend>连接图例</legend>
			<span><i></i>普通连接</span>
			<span><i class="river"></i>跨河（箭头为受影响进攻方向）</span>
			<span><i class="alpine"></i>高山道路</span>
			<span><i class="ap-only"></i>仅协约国</span>
			<span><i class="cp-only"></i>仅同盟国</span>
			<span><i class="restricted"></i>禁止进攻／海峡限制</span>
		</fieldset>
		<p id="audit-status" class="audit-status"></p>
		<section id="selection">点击地图对象进行编辑。</section>
		<h3>逐字段差异</h3>
		<select id="diff-filter"><option value="all">全部</option><option value="spaces">地块</option><option value="edges">连接</option><option value="mapAudit">审计</option></select>
		<pre id="diff">尚无修改</pre>
		<h3>审计结果</h3><pre id="report">尚未执行</pre>
	</aside>
	<main><div id="viewport"><div id="board-shell"><div id="board">
		<img id="map-image" src="/assets/map.png" alt="地图">
		<svg id="old-edges"></svg><svg id="edges"></svg><div id="old-objects"></div><div id="objects"></div><div id="placement-layer" hidden></div>
	</div></div></div></main>
	<dialog id="space-dialog">
		<form id="space-form" method="dialog">
			<h2>新建地块</h2>
			<label><span>ID</span><input name="id" required pattern="[a-z][a-z0-9_]*" placeholder="new_space"></label>
			<label><span>名称</span><input name="name" required></label>
			<label><span>国籍</span><select name="nation"></select></label>
			<label><span>阵营</span><select name="faction"></select></label>
			<label><span>初始控制</span><select name="control"></select></label>
			<label><span>地形</span><select name="terrain"></select></label>
			<label><span>点击宽</span><input name="width" type="number" min="20" max="6082" value="184" required></label>
			<label><span>点击高</span><input name="height" type="number" min="20" max="6000" value="184" required></label>
			<label><span>要塞等级</span><select name="fort"><option value="0">无</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
			<fieldset><legend>属性</legend>
				<label><input name="supply" type="checkbox">补给源</label>
				<label><input name="port" type="checkbox">港口</label>
				<label><input name="vp" type="checkbox">VP地区</label>
				<label><input name="large_area" type="checkbox">大型区域</label>
			</fieldset>
			<p>提交后在地图上点击地块中心。</p>
			<div class="dialog-actions"><button id="cancel-create-space" type="button">取消</button><button class="confirm" type="submit">开始放置</button></div>
		</form>
	</dialog>
</body>
</html>
